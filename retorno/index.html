<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3f51b5">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escala">
<title>Retorno da mesa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,500,600,700,800&display=swap">
<link rel="stylesheet" href="../theme.css">
<script src="../theme.js"></script>
<script src="../site.js" defer></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); background-image: var(--page-bg); background-attachment: fixed; color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; min-height: 100vh; padding: 16px clamp(16px, 3vw, 40px) 48px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { color: var(--brand-text); font-weight: 700; font-size: clamp(28px, 6vw, 40px); line-height: 1.05; margin: 8px 0 0; letter-spacing: -0.02em; }
.cartao { background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.cartao p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
.botao { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 13px 18px; border-radius: 999px; background: var(--brand); color: var(--on-brand); font: inherit; font-weight: 700; text-decoration: none; border: 0; cursor: pointer; }
.botao.secundario { background: transparent; color: var(--brand-text); border: 1px solid var(--border); }
.voltar { color: var(--brand-text); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <a class="voltar" href="../">← Início</a>
  <h1>Retorno da mesa</h1>
  <div class="cartao" id="estado" aria-live="polite">
    <p>Procurando a mesa…</p>
  </div>
</div>
<script>
// Endereço da ponte (celular do master, no Wi-Fi da igreja), publicado pelo app Retorno AXIOS.
var FUNCAO = "https://ipdrbhkzluuwjulkhjkd.supabase.co/functions/v1/mesa-retorno";
var caixa = document.getElementById("estado");

function mostrar(html) { caixa.innerHTML = html; }

function procurar() {
  mostrar("<p>Procurando a mesa…</p>");
  fetch(FUNCAO, { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ativa && d.url) {
        mostrar(
          "<p><strong>A mesa está ativa.</strong></p>" +
          "<p class='muted'>Você precisa estar conectado ao <strong>Wi-Fi da igreja</strong>. Na primeira vez, informe seu nome e o PIN do ministério.</p>" +
          "<a class='botao' href='" + d.url + "'>Abrir meu retorno</a>"
        );
        // abre sozinho; o botão fica para o caso de o navegador bloquear
        setTimeout(function () { location.href = d.url; }, 600);
      } else {
        mostrar(
          "<p><strong>A mesa não está ativa agora.</strong></p>" +
          "<p class='muted'>O retorno só funciona durante o culto, depois que o responsável pela mesa liga o app no celular dele.</p>" +
          "<button type='button' class='botao secundario' onclick='procurar()'>Tentar de novo</button>"
        );
      }
    })
    .catch(function () {
      mostrar(
        "<p><strong>Sem conexão com a internet.</strong></p>" +
        "<p class='muted'>Se você já está no Wi-Fi da igreja, peça ao responsável pela mesa o QR code do retorno.</p>" +
        "<button type='button' class='botao secundario' onclick='procurar()'>Tentar de novo</button>"
      );
    });
}
procurar();
</script>
</body>
</html>
