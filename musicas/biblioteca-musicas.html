<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca de Músicas</title>
<meta name="theme-color" content="#3f51b5">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700&display=swap">
<meta name="description" content="Biblioteca de músicas do ministério com dados reais: busca por música, cantor, tema e estilo.">
<style>
  :root {
    --bg: #e3f0ff; --page-bg: linear-gradient(135deg, #e3f0ff 0%, #faf3e3 100%);
    --surface: #ffffff; --surface-2: #f1f3fb; --border: #dfe3f0;
    --text: #222222; --muted: #5f6b85; --brand: #3f51b5; --brand-dark: #283593; --brand-text: #3f51b5; --warn: #b45309;
    --radius: 16px; --shadow: 0 4px 16px rgba(0, 0, 0, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1626; --page-bg: linear-gradient(135deg, #0f1626 0%, #1b1a17 100%);
      --surface: #172033; --surface-2: #1d2740; --border: #2a3552;
      --text: #e6e9ef; --muted: #a5afc0; --brand: #5c6bc0; --brand-dark: #7986cb; --brand-text: #9fb0ff; --warn: #fbbf24; --shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1626; --page-bg: linear-gradient(135deg, #0f1626 0%, #1b1a17 100%);
    --surface: #172033; --surface-2: #1d2740; --border: #2a3552;
    --text: #e6e9ef; --muted: #a5afc0; --brand: #5c6bc0; --brand-dark: #7986cb; --brand-text: #9fb0ff; --warn: #fbbf24; --shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); background-image: var(--page-bg); background-attachment: fixed; min-height: 100vh; color: var(--text); font: 15px/1.5 'Montserrat', 'Segoe UI', system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 26px; margin: 0; letter-spacing: .5px; font-weight: 700; color: var(--brand-text); }
  .sub { color: var(--muted); font-size: 13px; }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  .btn { font-weight: 600; transition: background .2s, box-shadow .2s; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn.primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn:focus-visible, .links a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand-text); outline-offset: 2px; }
  dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 22px; width: min(420px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h2 { margin: 0 0 14px; font-size: 18px; }
  .form { display: grid; gap: 10px; }
  .form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form input, .form select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); }
  .form .actions { display: flex; gap: 8px; margin-top: 6px; }
  .form .actions .btn { flex: 1; }
  .msg { font-size: 13px; min-height: 1.2em; }
  .msg.err { color: #dc2626; }
  .msg.ok { color: #059669; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }

  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { padding: 14px 16px; }
  .stat .v { color: var(--brand-text); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

  .filters { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; margin-bottom: 16px; }
  .filters input, .filters select { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); min-width: 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .song { padding: 16px 18px; display: grid; gap: 10px; transition: transform .18s, box-shadow .18s; }
  .song:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(63, 81, 181, 0.18); }
  .song .title { font-weight: 650; font-size: 15px; }
  .song .artist { color: var(--muted); font-size: 13px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .tag.style-celebracao { color: var(--warn); }
  .tag.style-adoracao { color: var(--brand-text); }
  .links { display: flex; gap: 6px; }
  .links a { flex: 1; text-align: center; font-size: 12px; font-weight: 600; padding: 7px 0; border-radius: 7px; background: var(--brand); color: #fff; text-decoration: none; transition: background .2s; }
  .links a:hover { background: var(--brand-dark); }

  .empty, .loading { text-align: center; color: var(--muted); padding: 50px 0; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  [hidden] { display: none !important; }

.site-nav { background: var(--surface); box-shadow: 0 2px 10px rgba(63,81,181,.12); position: sticky; top: 0; z-index: 50; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 4px; }
  .site-nav-in { max-width: 1400px; margin: 0 auto; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .site-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--brand-text); text-decoration: none; letter-spacing: .3px; }
  .site-brand img { border-radius: 50%; background: #fff; }
  .site-links { display: flex; gap: 4px; }
  .site-links a { padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: .95em; color: var(--brand-text); text-decoration: none; }
  .site-links a:hover { background: var(--surface-2); }
  .site-links a[aria-current="page"] { background: var(--brand-text); color: var(--surface); }
  .site-brand:focus-visible, .site-links a:focus-visible { outline: 2px solid var(--brand-text); outline-offset: 2px; }
  @media (max-width: 420px) { .site-brand span { display: none; } .site-links a { padding-inline: 10px; } }
  
  @media (max-width: 720px) {
    .filters { grid-template-columns: 1fr 1fr; }
    .filters input { grid-column: 1 / -1; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="wrap">
  <nav class="site-nav" aria-label="Menu principal">
    <div class="site-nav-in">
      <a class="site-brand" href="../"><img src="../logo%20louvor.png" alt="" width="34" height="34"><span>Louvor CEVD</span></a>
      <div class="site-links"><a href="../">Início</a><a href="../escala/">Escala</a><a href="./biblioteca-musicas.html" aria-current="page">Músicas</a></div>
    </div>
  </nav>
  <header class="top">
    <div>
      <h1>Biblioteca de Músicas</h1>
      <div class="sub" id="updated"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn primary" id="addBtn">+ Nova música</button>
      <button class="btn" id="refreshBtn" title="Recarregar dados">Atualizar</button>
      <button class="btn" id="themeBtn" title="Alternar tema">Tema</button>
    </div>
  </header>

  <section class="stats">
    <div class="card stat"><div class="v" id="stTotal">–</div><div class="k">Músicas</div></div>
    <div class="card stat"><div class="v" id="stTemas">–</div><div class="k">Temas</div></div>
  </section>

  <div class="filters">
    <input id="search" type="search" placeholder="Buscar por música ou cantor…">
    <select id="themeFilter"><option value="">Todos os temas</option></select>
    <select id="styleFilter"><option value="">Todos os estilos</option></select>
    <select id="sortBy">
      <option value="az">A–Z</option>
      <option value="new">Adicionadas recentemente</option>
    </select>
  </div>
  <div class="count" id="songCount"></div>
  <div class="grid" id="songGrid"></div>
  <div class="loading" id="loading">Carregando…</div>
</main>

<dialog id="addDialog">
  <h2>Nova música</h2>
  <form class="form" id="addForm">
    <input id="fSong" placeholder="Nome da música" maxlength="120" required>
    <input id="fSinger" placeholder="Cantor / Banda" maxlength="120" required>
    <div class="row">
      <select id="fTheme" required><option value="">Tema...</option></select>
      <select id="fStyle"><option>Adoração</option><option>Celebração</option></select>
    </div>
    <input id="fPin" placeholder="PIN" inputmode="numeric" autocomplete="off" hidden>
    <div class="msg" id="fMsg" role="status"></div>
    <div class="actions">
      <button type="button" class="btn" id="fCancel">Cancelar</button>
      <button type="submit" class="btn primary" id="fSave">Salvar</button>
    </div>
  </form>
</dialog>

<script>
  // Dados reais vindos da Edge Function pública do Supabase (sem login).
  const API_URL = 'https://ipdrbhkzluuwjulkhjkd.supabase.co/functions/v1/biblioteca-musicas';

  const $ = (id) => document.getElementById(id);
  let songs = [];

  // ---------- Tema ----------
  const savedTheme = (() => { try { return localStorage.getItem('bm-theme'); } catch { return null; } })();
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  $('themeBtn').onclick = () => {
    const isDark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = isDark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('bm-theme', next); } catch {}
  };

  // ---------- Helpers ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const links = (song, singer) => {
    const q = `${song} ${singer || ''}`.trim();
    const google = (extra) => 'https://www.google.com/search?q=' + encodeURIComponent(`${q} ${extra}`);
    return {
      YouTube: 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q),
      Spotify: 'https://open.spotify.com/search/' + encodeURIComponent(q),
      Letra: google('letra site:letras.mus.br'),
      Cifra: google('cifra site:cifraclub.com.br'),
    };
  };

  // ---------- Dados ----------
  async function loadData() {
    $('loading').hidden = false;
    $('loading').textContent = 'Carregando…';
    try {
      const res = await fetch(API_URL, { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

      pinRequired = Boolean(data.pin_obrigatorio);
      $('fPin').hidden = !pinRequired;
      $('fPin').required = pinRequired;
      const curTheme = $('fTheme').value;
      $('fTheme').innerHTML = '<option value="">Tema...</option>' +
        (data.temas || []).map((t) => `<option>${esc(t)}</option>`).join('');
      $('fTheme').value = curTheme;

      songs = data.musicas.map((m) => ({
        title: m.musica || 'Sem título',
        singer: m.cantor || '',
        style: m.estilo || '',
        theme: m.tema || 'Sem tema',
        created: m.criada_em,
      }));

      $('updated').textContent = 'Atualizado em ' + new Date(data.atualizado_em).toLocaleString('pt-BR');
      fillFilters();
      $('stTotal').textContent = songs.length.toLocaleString('pt-BR');
      $('stTemas').textContent = new Set(songs.map((s) => s.theme)).size.toLocaleString('pt-BR');
      renderSongs();
      $('loading').hidden = true;
    } catch (err) {
      console.error(err);
      $('loading').textContent = 'Não foi possível carregar as músicas. Tente "Atualizar".';
    }
  }
  $('refreshBtn').onclick = () => loadData();

  // ---------- Render ----------
  function fillFilters() {
    const themes = [...new Set(songs.map((s) => s.theme))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    const styles = [...new Set(songs.map((s) => s.style).filter(Boolean))].sort();
    const keep = (sel, values, label) => {
      const cur = sel.value;
      sel.innerHTML = `<option value="">${label}</option>` + values.map((v) => `<option>${esc(v)}</option>`).join('');
      sel.value = values.includes(cur) ? cur : '';
    };
    keep($('themeFilter'), themes, 'Todos os temas');
    keep($('styleFilter'), styles, 'Todos os estilos');
  }

  function renderSongs() {
    const q = norm($('search').value);
    const theme = $('themeFilter').value;
    const style = $('styleFilter').value;

    const list = songs.filter((s) =>
      (!q || norm(s.title).includes(q) || norm(s.singer).includes(q)) &&
      (!theme || s.theme === theme) &&
      (!style || s.style === style));

    list.sort($('sortBy').value === 'new'
      ? (a, b) => String(b.created || '').localeCompare(String(a.created || ''))
      : (a, b) => a.title.localeCompare(b.title, 'pt-BR'));

    $('songCount').textContent = `${list.length} de ${songs.length} músicas`;
    $('songGrid').innerHTML = list.length === 0
      ? '<div class="empty">Nenhuma música encontrada.</div>'
      : list.map((s) => `
        <article class="card song">
          <div>
            <div class="title">${esc(s.title)}</div>
            <div class="artist">${esc(s.singer || 'Cantor não informado')}</div>
          </div>
          <div class="tags">
            <span class="tag">${esc(s.theme)}</span>
            ${s.style ? `<span class="tag style-${norm(s.style)}">${esc(s.style)}</span>` : ''}
          </div>
          <div class="links">
            ${Object.entries(links(s.title, s.singer)).map(([label, url]) =>
              `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`).join('')}
          </div>
        </article>`).join('');
  }

  ['search', 'themeFilter', 'styleFilter', 'sortBy'].forEach((id) =>
    $(id).addEventListener('input', renderSongs));

  // ---------- Cadastro ----------
  let pinRequired = false;
  const fMsg = (text, kind) => { $('fMsg').textContent = text; $('fMsg').className = 'msg ' + (kind || ''); };
  $('addBtn').onclick = () => { fMsg(''); $('addDialog').showModal(); $('fSong').focus(); };
  $('fCancel').onclick = () => $('addDialog').close();
  $('addForm').onsubmit = async (e) => {
    e.preventDefault();
    $('fSave').disabled = true;
    fMsg('Salvando…');
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          musica: $('fSong').value, cantor: $('fSinger').value,
          tema: $('fTheme').value, estilo: $('fStyle').value, pin: $('fPin').value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Erro ao salvar.');
      fMsg('Música adicionada!', 'ok');
      $('fSong').value = ''; $('fSinger').value = '';
      await loadData();
      setTimeout(() => $('addDialog').close(), 700);
    } catch (err) {
      fMsg(err.message, 'err');
    } finally {
      $('fSave').disabled = false;
    }
  };

  loadData();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});
</script>
</body>
</html>
