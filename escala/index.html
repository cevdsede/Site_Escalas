<style>
/* Layout: cabeçalho + filtro por pessoa, depois semanas empilhadas; cada culto é uma linha com data à esquerda e equipe à direita */
:root {
  --fg: var(--text);
  --line: var(--border);
  --accent: var(--brand-text);
  --accent-soft: var(--brand-soft);
  --font-display: var(--font);
  --font-body: var(--font);
}
* { box-sizing: border-box; }
body { background: var(--bg); background-image: var(--page-bg); background-attachment: fixed; color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-inline: clamp(16px, 3vw, 40px); padding-block: 28px 56px; }
.wrap { max-width: none; width: 100%; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }
main#weeks { width: 100%; max-width: none; margin: 0; }
header { display: flex; flex-direction: column; gap: 6px; }
h1 { color: var(--brand-text); font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 6vw, 44px); line-height: 1.05; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }
.filter { display: flex; flex-direction: column; gap: 10px; }
.filter-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font: inherit; font-weight: 500; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.pill:hover { border-color: var(--accent); }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.pill:focus-visible, .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.back { align-self: flex-start; color: var(--accent); font-weight: 600; text-decoration: none; padding: 4px 0; }
.back:hover { text-decoration: underline; }
.back:focus-visible, .cal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.next-box { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.next-box[hidden] { display: none; }
@media (min-width: 1000px) {
  .next-box { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; column-gap: 28px; padding: 14px 22px; }
  .next-top { display: contents; }
  .next-label { order: 1; }
  .next-main { order: 2; }
  .next-sub { order: 3; }
  .next-top .cal { order: 4; }
}
.next-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.next-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.next-main { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.next-sub { color: var(--muted); }
.cal { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.cal:hover { background: var(--accent); color: var(--surface); }
.badge.warn { color: var(--today); }
.none p { margin: 0 0 12px; }
.none p:last-child { margin-bottom: 0; }
.none-title { font-weight: 600; color: var(--text); }
.none-sub { font-size: 14px; }
.summary { color: var(--accent); font-weight: 600; min-height: 1.4em; }
.week { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; align-items: start; }
.week-title { grid-column: 1 / -1; font-family: var(--font-display); font-weight: 500; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin: 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.svc { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.svc.today { border-color: var(--today); background: linear-gradient(0deg, var(--today-soft), var(--today-soft)), var(--surface); }
.svc.past { opacity: .62; }
.date { grid-row: span 2; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; line-height: 1; padding-top: 2px; }
.date .d { font-family: var(--font-display); font-weight: 700; font-size: 32px; font-variant-numeric: tabular-nums; }
.date .m { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 4px; }
.date .w { font-size: 12px; color: var(--muted); margin-top: 2px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-width: 0; }
.culto { font-weight: 600; font-size: 16px; }
.time { color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--today); background: var(--today-soft); border: 1px solid var(--today); border-radius: 4px; padding: 1px 6px; }
.next { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
.ens { font-size: 13px; color: var(--muted); }
.team { display: flex; flex-wrap: wrap; gap: 8px 22px; min-width: 0; }
.role { display: flex; flex-direction: column; min-width: 0; }
.role-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.who { font-weight: 500; overflow-wrap: anywhere; }
.who.min { font-weight: 600; color: var(--accent); }
.who span.me { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 5px; margin-inline: -5px; box-shadow: 0 0 0 1px var(--accent) inset; }
.rep-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.add-rep { font: inherit; font-size: 13px; font-weight: 600; color: var(--brand-text); background: var(--brand-soft); border: 1px solid var(--border); border-radius: 999px; padding: 2px 12px; cursor: pointer; }
.add-rep:hover { border-color: var(--brand-text); }
.add-rep:focus-visible { outline: 2px solid var(--brand-text); outline-offset: 2px; }
.rep-list { display: flex; flex-direction: column; }
.rep-item { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--border); font-size: 14px; }
.rep-item:first-child { border-top: 0; }
.rep-item .tom { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.rep-item .mus { color: var(--text); font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
.rep-item .mus:hover { color: var(--brand-text); text-decoration: underline; }
.rep-item .who-rep { color: var(--muted); font-size: 13px; text-align: right; }
.del-rep { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0 8px; border-radius: 8px; font-size: 18px; line-height: 1; }
.del-rep:hover { color: #dc2626; background: var(--surface-2); }
.del-rep:focus-visible { outline: 2px solid var(--brand-text); outline-offset: 2px; }
.rep-empty { color: var(--muted); font-size: 14px; }
@media (max-width: 480px) { .rep-item { grid-template-columns: 64px minmax(0, 1fr) auto; } .rep-item .who-rep { display: none; } }
dialog#repDialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 0; width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
dialog#repDialog::backdrop { background: rgba(0, 0, 0, .55); }
.rep-form { display: grid; gap: 12px; padding: 18px; }
.rep-form h2 { margin: 0; font-size: 20px; font-family: var(--font-display); color: var(--brand-text); }
.rep-sub { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
.rep-form label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
.rep-form input, .rep-form select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; font-weight: 400; }
.rep-form select[size] { padding: 4px; }
.rep-form option:disabled { color: var(--muted); }
.rep-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rep-row label[hidden] { display: none; }
.rep-msg { font-size: 13px; min-height: 1.2em; }
.rep-msg.err { color: #dc2626; }
.rep-msg.ok { color: #059669; }
.rep-actions { display: flex; gap: 8px; justify-content: flex-end; }
.pill.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.pill:disabled { opacity: .6; cursor: default; }
@media (max-width: 480px) { .rep-row { grid-template-columns: 1fr; } }
.foot-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.rep { grid-column: 2; display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 500; color: var(--brand-text); background: var(--brand-soft); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; text-decoration: none; }
.chip:hover { border-color: var(--brand-text); }
.chip:focus-visible { outline: 2px solid var(--brand-text); outline-offset: 2px; }
.tbd { color: var(--empty); font-style: italic; font-size: 14px; }
.none { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
footer { color: var(--muted); font-size: 13px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
@media (max-width: 480px) {
  .svc { grid-template-columns: 52px minmax(0, 1fr); padding: 12px; gap: 4px 12px; }
  .date .d { font-size: 26px; }
}
@media (prefers-reduced-motion: no-preference) { .pill { transition: background .15s, border-color .15s; } }
body { margin: 0; }
</style>

<script>
var SHEET_ID = "1K47eF2raU_RB69ziWpV7P7NS5cyWfRhlsofXt9MWOz8";
var MONTHS = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var DOW = ["dom.","seg.","ter.","qua.","qui.","sex.","sáb."];
var ROLES = [["Ministro","min"],["Back","back"],["Teclado","tec"],["Guitarra","gui"],["Baixo","bai"],["Bateria","bat"],["Violão","vio"],["Ministro e vocal","voc"]];
var API_URL = "https://ipdrbhkzluuwjulkhjkd.supabase.co/functions/v1/repertorio-publico";

function list(s) { return s ? s.split(",").map(function (x) { return x.trim(); }).filter(Boolean) : []; }
function parse(line, year) {
  var p = line.split("|").map(function (s) { return s.trim(); });
  var dm = p[0].split("/");
  var date = new Date(year, +dm[1] - 1, +dm[0], +p[1].slice(0, 2), +p[1].slice(3, 5));
  return { date: date, iso: year + "-" + pad(+dm[1]) + "-" + pad(+dm[0]), voc: [], api: null, day: dm[0], month: MONTHS[+dm[1] - 1], dow: DOW[date.getDay()], time: p[1], culto: p[2],
    min: list(p[3]), back: list(p[4]), vio: list(p[5]), tec: list(p[6]), gui: list(p[7]), bai: list(p[8]), bat: list(p[9]), ens: p[10] || "", rep: (p[12] || "").split(";").map(function (x) { return x.trim(); }).filter(Boolean) };
}
// groups: array of arrays of "|" lines. Assigns years in order, rolling over at December -> January.
// O ano não vem na planilha: usa o dia da semana (qui., sex.…) da primeira linha para descobrir qual ano bate.
function firstYear(line, now) {
  var y = now.getFullYear();
  if (!line) return y;
  var dm = line[0].split("/"), idx = DOW.indexOf((line[11] || "").toLowerCase());
  var best = null;
  [y - 1, y, y + 1].forEach(function (c) {
    var d = new Date(c, +dm[1] - 1, +dm[0]);
    if (idx >= 0 && d.getDay() !== idx) return;
    if (best === null || Math.abs(d - now) < Math.abs(new Date(best, +dm[1] - 1, +dm[0]) - now)) best = c;
  });
  if (best !== null) return best;
  return +dm[1] - 1 > now.getMonth() + 6 ? y - 1 : y;
}
function build(groups) {
  var now = new Date(), firstLine = null;
  groups.some(function (g) { if (g.length) { firstLine = g[0].split("|"); return true; } });
  var first = firstLine ? +firstLine[0].split("/")[1] : null;
  var year = firstYear(firstLine, now);
  var prev = first || 1;
  return groups.map(function (g) {
    return g.map(function (line) {
      var m = +line.split("|")[0].split("/")[1];
      if (m < prev) year += 1;
      prev = m;
      return parse(line, year);
    });
  });
}
var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRr-IeGQaXSrMhllDs5sFerSyS2kh9y82GF49GnH44nJP7l4cGFImQpV_lmJMm2RIGZxI7TSeHHwrgh/pub?gid=1851257255&single=true&output=csv";
function csvRows(text) {
  var rows = [], row = [], cur = "", q = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);
    if (q) {
      if (ch === '"') { if (text.charAt(i + 1) === '"') { cur += '"'; i++; } else q = false; } else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text.charAt(i + 1) === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
// Columns: Data, dia, hora, Culto, Ministro x2, Back x3, Violão, Teclado, Guitarra, Baixo, Bateria, Ensaio
function groupsFromCsv(text) {
  var groups = [[]], repCol = -1;
  csvRows(text).forEach(function (r) {
    var c = r.map(function (s) { return s.trim(); });
    while (c.length < 15) c.push("");
    if (c[0].toLowerCase() === "data") {
      // coluna opcional com as músicas do culto, separadas por ponto e vírgula
      c.forEach(function (h, i) { if (repCol < 0 && /^(repert|m[uú]sicas)/i.test(h)) repCol = i; });
    }
    if (/^\d{1,2}\/\d{1,2}$/.test(c[0])) {
      var min = [c[4], c[5]].filter(Boolean).join(",");
      var back = [c[6], c[7], c[8]].filter(Boolean).join(",");
      groups[groups.length - 1].push([c[0], c[2], c[3], min, back, c[9], c[10], c[11], c[12], c[13], c[14] || "", c[1], repCol >= 0 ? (c[repCol] || "").replace(/\|/g, " ") : ""].join("|"));
    } else if (c.slice(0, 15).every(function (x) { return !x; })) {
      if (groups[groups.length - 1].length) groups.push([]);
    }
  });
  return groups.filter(function (g) { return g.length; });
}

var data = [];          // escala completa (planilha + cultos que só existem no app)
var sheetData = [];     // semanas lidas da planilha
var api = null;         // dados do app de repertório: cultos, músicas, tons, repertórios
var repByCulto = {}, cultoByKey = {};
var loaded = false, failed = false;
var selected = null, view = "all";
try {
  selected = localStorage.getItem("escala.pessoa") || null;
  view = localStorage.getItem("escala.visao") === "week" ? "week" : "all";
} catch (e) {}
function save(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }

function firstName(n) { return String(n || "").trim().split(/\s+/)[0]; }
function indexApi() {
  cultoByKey = {}; repByCulto = {};
  if (!api) return;
  api.cultos.forEach(function (c) { cultoByKey[c.data + " " + c.horario] = c; });
  api.repertorios.forEach(function (r) { if (r.culto && r.culto.id) repByCulto[r.culto.id] = r.itens || []; });
}
// Junta a planilha com os cultos do app. Culto que só está no app aparece com os ministros e vocais escalados.
function rebuildData() {
  indexApi();
  var have = {};
  sheetData.forEach(function (w) { w.forEach(function (s) {
    have[s.iso + " " + s.time] = 1;
    s.api = cultoByKey[s.iso + " " + s.time] || null;
    // linha da planilha ainda sem equipe: mostra os ministros e vocais escalados no app
    var comEquipe = ROLES.some(function (r) { return r[1] !== "voc" && s[r[1]].length; });
    s.voc = (s.api && !comEquipe) ? s.api.cantores.map(function (x) { return firstName(x.nome); }) : [];
  }); });
  var extra = [];
  if (api) api.cultos.forEach(function (c) {
    if (have[c.data + " " + c.horario]) return;
    var p = c.data.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2], +c.horario.slice(0, 2), +c.horario.slice(3, 5));
    extra.push({ date: d, iso: c.data, day: p[2], month: MONTHS[+p[1] - 1], dow: DOW[d.getDay()], time: c.horario,
      culto: String(c.nome || "").trim(), min: [], back: [], vio: [], tec: [], gui: [], bai: [], bat: [],
      voc: c.cantores.map(function (x) { return firstName(x.nome); }), ens: "", rep: [], api: c });
  });
  extra.sort(function (a, b) { return a.date - b.date; });
  var weeks = [];
  extra.forEach(function (s) {
    var w = weeks[weeks.length - 1];
    if (w && s.date - w[w.length - 1].date < 3 * 86400e3) w.push(s); else weeks.push([s]);
  });
  data = sheetData.concat(weeks).sort(function (a, b) { return a[0].date - b[0].date; });
}
function repItems(s) { return s.api ? (repByCulto[s.api.id] || []) : []; }

function key(d) { return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function todayKey() { return key(new Date()); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hasPerson(s, n) { return ROLES.some(function (r) { return s[r[1]].indexOf(n) >= 0; }); }
function isEmpty(s) { return !s.rep.length && !ROLES.some(function (r) { return s[r[1]].length; }); }
function rolesOf(s, n) { return ROLES.filter(function (r) { return s[r[1]].indexOf(n) >= 0; }).map(function (r) { return r[0]; }); }
// Same person listed in more than one role in the same service (guests excluded).
function doubled(s) {
  var seen = {}, out = [];
  ROLES.forEach(function (r) { s[r[1]].forEach(function (n) {
    if (n === "Convidado") return;
    seen[n] = (seen[n] || 0) + 1;
    if (seen[n] === 2) out.push(n);
  }); });
  return out;
}
function pad(n) { return (n < 10 ? "0" : "") + n; }
function icsStamp(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00"; }
function icsHref(s) {
  var end = new Date(s.date.getTime() + 2 * 3600e3);
  var items = repItems(s);
  var songs = items.length ? items.map(function (i) { return i.musica + (i.tom ? " (" + i.tom + ")" : ""); }) : s.rep;
  var team = ROLES.filter(function (r) { return s[r[1]].length; }).map(function (r) { return r[0] + ": " + s[r[1]].join(", "); }).join("\\n");
  var lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Escala Louvor//PT", "BEGIN:VEVENT",
    "UID:" + icsStamp(s.date) + "@escala-louvor", "DTSTAMP:" + icsStamp(new Date()),
    "DTSTART:" + icsStamp(s.date), "DTEND:" + icsStamp(end),
    "SUMMARY:" + (s.culto || "Culto") + " (Louvor)", "DESCRIPTION:" + team + (songs.length ? "\\nRepertório: " + songs.join(", ") : ""), "END:VEVENT", "END:VCALENDAR"];
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(lines.join("\r\n"));
}
function calLink(s) {
  var a = el("a", "cal", "Agendar");
  a.href = icsHref(s);
  a.download = "culto-" + s.day + "-" + s.month + ".ics";
  a.title = "Adicionar ao calendário do celular";
  return a;
}

// Hide finished weeks and services nobody is scheduled for.
function visibleWeeks() {
  var t = todayKey();
  var weeks = data.map(function (w) {
    if (w.every(function (s) { return key(s.date) < t; })) return [];
    return w.filter(function (s) { return !isEmpty(s) && (!selected || hasPerson(s, selected)); });
  }).filter(function (w) { return w.length; });
  return view === "week" ? weeks.slice(0, 1) : weeks;
}
function allNames() {
  var set = {};
  data.forEach(function (w) { w.forEach(function (s) { ROLES.forEach(function (r) { s[r[1]].forEach(function (n) { set[n] = 1; }); }); }); });
  return Object.keys(set).filter(function (n) { return n !== "Convidado"; }).sort(function (a, b) { return a.localeCompare(b, "pt"); });
}

function renderNext(nextSvc) {
  var box = document.getElementById("next");
  box.textContent = "";
  box.hidden = !nextSvc;
  if (!nextSvc) return;
  var s = nextSvc;
  var top = el("div", "next-top");
  top.appendChild(el("span", "next-label", key(s.date) === todayKey() ? "Hoje" : "Próximo culto"));
  top.appendChild(calLink(s));
  box.appendChild(top);
  box.appendChild(el("div", "next-main", s.dow + " " + s.day + "/" + s.month + " · " + s.time + " · " + (s.culto || "Sexta-feira")));
  var sub = [];
  if (selected && hasPerson(s, selected)) sub.push("Sua função: " + rolesOf(s, selected).join(" e "));
  else if (s.min.length) sub.push("Ministro: " + s.min.join(", "));
  if (sub.length) box.appendChild(el("div", "next-sub", sub.join(" · ")));
}

// Mensagem quando não há culto escalado daqui para frente.
function lastScheduled(name) {
  var last = null;
  data.forEach(function (w) { w.forEach(function (s) {
    if (!isEmpty(s) && (!name || hasPerson(s, name))) last = s;
  }); });
  return last;
}
function fillEmpty(box) {
  var who = selected ? "para " + selected : "";
  box.appendChild(el("p", "none-title", selected ? "Nenhuma escala próxima " + who + "." : "Ainda não há escala para as próximas semanas."));
  var last = lastScheduled(selected);
  if (last) {
    var txt = "Última escala " + (selected ? "de " + selected : "preenchida") + ": " + last.dow + " " + last.day + "/" + pad(last.date.getMonth() + 1) + "/" + last.date.getFullYear() + " · " + (last.culto || "Sexta-feira");
    if (!selected && last.min.length) txt += " (ministro: " + last.min.join(", ") + ")";
    box.appendChild(el("p", "none-sub", txt));
  }
  box.appendChild(el("p", "none-sub", "Assim que a planilha for preenchida, a escala aparece aqui sozinha."));
}

function render() {
  var root = document.getElementById("weeks");
  root.textContent = "";
  var weeks = visibleWeeks(), count = 0, nextSvc = null;
  weeks.forEach(function (w) { w.forEach(function (s) {
    var k = key(s.date);
    if (!nextSvc && (k > todayKey() || (k === todayKey() && s.date.getTime() + 2 * 3600e3 >= Date.now()))) nextSvc = s;
  }); });
  renderNext(nextSvc);
  weeks.forEach(function (list) {
    var sec = el("section", "week");
    var a = list[0], b = list[list.length - 1];
    sec.appendChild(el("h2", "week-title", a.day + " " + a.month + " – " + b.day + " " + b.month));
    list.forEach(function (s) {
      count++;
      var k = key(s.date);
      var card = el("article", "svc" + (k === todayKey() ? " today" : "") + (k < todayKey() ? " past" : ""));
      var d = el("div", "date");
      d.appendChild(el("span", "d", s.day));
      d.appendChild(el("span", "m", s.month));
      d.appendChild(el("span", "w", s.dow));
      card.appendChild(d);
      var head = el("div", "head");
      head.appendChild(el("span", "culto", s.culto || "Sexta-feira"));
      head.appendChild(el("span", "time", s.time));
      if (k === todayKey()) head.appendChild(el("span", "badge", "Hoje"));
      else if (s === nextSvc) head.appendChild(el("span", "badge next", "Próximo"));
      if (s.ens) head.appendChild(el("span", "ens", "Ensaio " + s.ens));
      var dup = doubled(s);
      if (dup.length) {
        var warn = el("span", "badge warn", "Confira: " + dup.join(", ") + " em 2 funções");
        warn.title = "A mesma pessoa aparece em mais de uma função neste culto";
        head.appendChild(warn);
      }
      if (k >= todayKey()) head.appendChild(calLink(s));
      card.appendChild(head);
      var team = el("div", "team");
      ROLES.forEach(function (r) {
        var arr = s[r[1]];
        if (!arr.length) return;
        var role = el("div", "role");
        role.appendChild(el("span", "role-name", r[0]));
        var who = el("span", "who" + (r[1] === "min" ? " min" : ""));
        arr.forEach(function (n, i) {
          if (i) who.appendChild(document.createTextNode(", "));
          who.appendChild(el("span", n === selected ? "me" : "", n));
        });
        role.appendChild(who);
        team.appendChild(role);
      });
      card.appendChild(team);
      var items = repItems(s);
      if (items.length || s.rep.length || s.api) {
        var rep = el("div", "rep");
        var rh = el("div", "rep-head");
        rh.appendChild(el("span", "role-name", "Repertório"));
        if (s.api) {
          var add = el("button", "add-rep", "+ Música");
          add.type = "button";
          add.addEventListener("click", (function (svc) { return function () { openRep(svc); }; })(s));
          rh.appendChild(add);
        }
        rep.appendChild(rh);
        if (items.length) {
          var ul = el("div", "rep-list");
          items.forEach(function (i) {
            var row = el("div", "rep-item");
            row.appendChild(el("span", "tom", i.tom || "—"));
            var a = el("a", "mus", i.musica);
            a.href = "../musicas/biblioteca-musicas.html?q=" + encodeURIComponent(i.musica);
            a.title = "Abrir na biblioteca de músicas";
            row.appendChild(a);
            row.appendChild(el("span", "who-rep", i.ministro));
            if (i.id) {
              var del = el("button", "del-rep", "\u00d7");
              del.type = "button";
              del.title = "Excluir do repertório";
              del.setAttribute("aria-label", "Excluir " + i.musica + " do repertório");
              del.addEventListener("click", (function (item) { return function () {
                if (window.SiteRep) window.SiteRep.excluir({ id: item.id, nome: item.musica, apiUrl: API_URL, pinRequired: !!(api && api.pin_obrigatorio), onDone: loadApi });
              }; })(i));
              row.appendChild(del);
            }
            ul.appendChild(row);
          });
          rep.appendChild(ul);
        } else if (s.rep.length) {
          var chips = el("div", "chips");
          s.rep.forEach(function (m) {
            var c = el("a", "chip", m);
            c.href = "../musicas/biblioteca-musicas.html?q=" + encodeURIComponent(m);
            chips.appendChild(c);
          });
          rep.appendChild(chips);
        } else {
          rep.appendChild(el("div", "rep-empty", "Nenhuma música ainda."));
        }
        card.appendChild(rep);
      }
      sec.appendChild(card);
    });
    root.appendChild(sec);
  });
  if (!count) {
    var box = el("div", "none");
    if (!loaded && !failed) box.textContent = "Carregando a escala…";
    else if (!loaded) {
      box.appendChild(el("p", null, "Não consegui ler a planilha agora."));
      var retry = el("button", "pill", "Tentar de novo");
      retry.type = "button";
      retry.addEventListener("click", function () { failed = false; render(); load(); });
      box.appendChild(retry);
    } else fillEmpty(box);
    root.appendChild(box);
  }
  document.getElementById("summary").textContent = selected ? selected + ": " + count + (count === 1 ? " escala" : " escalas") : "";
}

function makePill(container, label, active, onClick) {
  var b = el("button", "pill", label);
  b.type = "button";
  b.setAttribute("aria-pressed", String(active));
  b.addEventListener("click", function () {
    onClick();
    Array.prototype.forEach.call(container.children, function (c) { c.setAttribute("aria-pressed", String(c === b)); });
    render();
  });
  container.appendChild(b);
}
var pills = document.getElementById("pills");
function renderPills() {
  var names = allNames();
  if (loaded && selected && names.indexOf(selected) < 0) { selected = null; save("escala.pessoa", null); }
  pills.textContent = "";
  [null].concat(names).forEach(function (n) {
    makePill(pills, n || "Todos", selected === n, function () { selected = n; save("escala.pessoa", n); });
  });
}
var views = document.getElementById("views");
[["week", "Esta semana"], ["all", "Tudo"]].forEach(function (v) {
  makePill(views, v[1], view === v[0], function () { view = v[0]; save("escala.visao", v[0]); });
});
renderPills();
render();

// Live sync: reads the published spreadsheet (CSV) and refreshes every minute.
var statusEl = document.getElementById("status");
function setStatus(msg) { statusEl.textContent = msg; }
// Cultos, músicas e repertórios do app (atualiza junto com a planilha)
function loadApi() {
  return fetch(API_URL, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }).then(function (j) {
    if (!j || !j.cultos) throw new Error("formato");
    api = j;
    save("escala.api", JSON.stringify(j));
    loaded = true; failed = false;
    rebuildData(); renderPills(); render();
  }).catch(function () {});
}

function load() {
  loadApi();
  fetch(CSV_URL, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("http " + r.status);
    return r.text();
  }).then(function (text) {
    var groups = groupsFromCsv(text);
    if (!groups.length) throw new Error("empty");
    sheetData = build(groups); rebuildData();
    loaded = true; failed = false;
    save("escala.csv", text);
    save("escala.csvAt", String(Date.now()));
    renderPills();
    render();
    setStatus("Planilha atualizada às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) + ". Atualiza sozinha a cada minuto.");
  }).catch(function () {
    if (!loaded) { failed = true; render(); setStatus("Sem conexão com a planilha."); }
    else setStatus("Sem conexão com a planilha. Mostrando a escala salva" + savedLabel() + ".");
  });
}
// ---------- Adicionar música ao repertório de um culto ----------
var curSvc = null;
var repDialog = document.getElementById("repDialog");
function normTxt(t) { return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
function fMsg(text, kind) { var m = document.getElementById("fMsg"); m.textContent = text; m.className = "rep-msg " + (kind || ""); }
function fillRepSongs() {
  var q = normTxt(document.getElementById("fBusca").value);
  var already = {};
  repItems(curSvc).forEach(function (i) { already[normTxt(i.musica) + "|" + normTxt(i.cantor)] = 1; });
  var box = document.getElementById("fMusica"), curVal = box.value;
  box.textContent = "";
  api.musicas.filter(function (m) { return !q || normTxt(m.musica).indexOf(q) >= 0 || normTxt(m.cantor).indexOf(q) >= 0; })
    .forEach(function (m) {
      var o = document.createElement("option");
      o.value = m.id;
      var dup = already[normTxt(m.musica) + "|" + normTxt(m.cantor)];
      o.textContent = m.musica + (m.cantor ? " — " + m.cantor : "") + (dup ? "  (já no repertório)" : "");
      o.disabled = !!dup;
      box.appendChild(o);
    });
  if (curVal) box.value = curVal;
}
function openRep(svc) {
  if (!api || !svc.api) return;
  curSvc = svc;
  document.getElementById("repTitle").textContent = "Repertório · " + (svc.culto || "Culto");
  document.getElementById("repSub").textContent = svc.dow + " " + svc.day + "/" + pad(svc.date.getMonth() + 1) + " · " + svc.time;
  var mem = document.getElementById("fMembro");
  mem.textContent = "";
  var first = document.createElement("option"); first.value = ""; first.textContent = svc.api.cantores.length ? "Selecione…" : "Ninguém escalado como ministro ou vocal"; mem.appendChild(first);
  svc.api.cantores.forEach(function (c) { var o = document.createElement("option"); o.value = c.id; o.textContent = c.nome; mem.appendChild(o); });
  if (svc.api.cantores.length === 1) mem.value = svc.api.cantores[0].id;
  var tom = document.getElementById("fTom");
  tom.textContent = "";
  var t0 = document.createElement("option"); t0.value = ""; t0.textContent = "Selecione…"; tom.appendChild(t0);
  api.tons.forEach(function (t) { var o = document.createElement("option"); o.value = t.id; o.textContent = t.nome; tom.appendChild(o); });
  document.getElementById("fBusca").value = "";
  document.getElementById("fPinLabel").hidden = !api.pin_obrigatorio;
  document.getElementById("fPin").required = !!api.pin_obrigatorio;
  try { document.getElementById("fPin").value = sessionStorage.getItem("escala.pin") || ""; } catch (e) {}
  fMsg("");
  fillRepSongs();
  if (repDialog.showModal) repDialog.showModal(); else repDialog.setAttribute("open", "");
}
document.getElementById("fBusca").addEventListener("input", fillRepSongs);
document.getElementById("fClose").addEventListener("click", function () { repDialog.close(); });
document.getElementById("repForm").addEventListener("submit", function (e) {
  e.preventDefault();
  if (!curSvc) return;
  var musica = document.getElementById("fMusica").value;
  if (!musica) { fMsg("Escolha uma música da lista.", "err"); return; }
  var save = document.getElementById("fSave");
  save.disabled = true;
  fMsg("Salvando…");
  var pin = document.getElementById("fPin").value;
  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      id_culto: curSvc.api.id,
      id_membros: document.getElementById("fMembro").value,
      id_musicas: musica,
      id_tons: Number(document.getElementById("fTom").value),
      pin: pin
    })
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) throw new Error(j.error || "Erro ao salvar.");
    });
  }).then(function () {
    try { if (pin) sessionStorage.setItem("escala.pin", pin); } catch (e) {}
    fMsg("Música adicionada ao repertório!", "ok");
    document.getElementById("fBusca").value = "";
    document.getElementById("fMusica").value = "";
    document.getElementById("fTom").value = "";
    return loadApi().then(function () { if (curSvc) { var k = curSvc.iso + " " + curSvc.time; curSvc = findSvc(k) || curSvc; fillRepSongs(); } });
  }).catch(function (err) {
    fMsg(err && err.message && err.message !== "Failed to fetch" ? err.message : "Sem conexão. Tente de novo.", "err");
  }).then(function () { save.disabled = false; });
});
function findSvc(k) {
  var found = null;
  data.forEach(function (w) { w.forEach(function (s) { if (s.iso + " " + s.time === k) found = s; }); });
  return found;
}

// Compartilhar o link da escala (menu do celular; no computador copia o link)
document.getElementById("share").addEventListener("click", function () {
  var info = { title: "Escala Louvor", text: "Escala do Ministério de Louvor", url: location.href.split("#")[0].split("?")[0] };
  if (navigator.share) { navigator.share(info).catch(function () {}); }
  else if (navigator.clipboard) {
    navigator.clipboard.writeText(info.url).then(function () { setStatus("Link da escala copiado."); }, function () { setStatus("Não consegui copiar o link."); });
  } else { setStatus("Link: " + info.url); }
});
function savedLabel() {
  try {
    var t = +localStorage.getItem("escala.csvAt");
    if (!t) return "";
    var d = new Date(t);
    return " em " + pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + " às " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  } catch (e) { return ""; }
}
// Mostra na hora a última escala vista, mesmo sem internet.
try {
  var cachedCsv = localStorage.getItem("escala.csv");
  if (cachedCsv) {
    var cachedGroups = groupsFromCsv(cachedCsv);
    if (cachedGroups.length) { sheetData = build(cachedGroups); rebuildData(); loaded = true; }
  }
} catch (e) {}
try {
  var cachedApi = JSON.parse(localStorage.getItem("escala.api") || "null");
  if (cachedApi && cachedApi.cultos) { api = cachedApi; rebuildData(); loaded = true; }
} catch (e) {}
if (loaded) { renderPills(); render(); }
setStatus(loaded ? "Mostrando a escala salva" + savedLabel() + ". Atualizando…" : "Conectando à planilha…");
load();
setInterval(load, 60000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
</script>
